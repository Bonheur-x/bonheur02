<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Mother's Day - Bouquet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
      min-height: 100vh;
      background: #ffe4e9;
      font-family: "Brush Script MT", cursive;
      overflow-x: hidden;
    }
    body {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #d44f78;
      padding: 20px 0;
    }
    .page-border {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .page-border::before,
    .page-border::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 42px;
    }
    .page-border::before {
      border: 1px solid #ff8fb3;
      box-shadow: 0 0 0 10px rgba(255, 182, 203, 0.22);
      background-image:
        radial-gradient(circle at 18px 18px, rgba(255, 179, 201, 0.85) 0%, rgba(255, 179, 201, 0) 42%),
        radial-gradient(circle at calc(100% - 18px) 18px, rgba(255, 179, 201, 0.85) 0%, rgba(255, 179, 201, 0) 42%),
        radial-gradient(circle at 18px calc(100% - 18px), rgba(255, 179, 201, 0.85) 0%, rgba(255, 179, 201, 0) 42%),
        radial-gradient(circle at calc(100% - 18px) calc(100% - 18px), rgba(255, 179, 201, 0.85) 0%, rgba(255, 179, 201, 0) 42%);
      background-repeat: no-repeat;
    }
    .page-border::after {
      inset: 18px;
      border: 1px solid #d9acb6;
      background-image:
        radial-gradient(circle at 16px 16px, rgba(217, 172, 182, 0.8) 0%, rgba(217, 172, 182, 0) 40%),
        radial-gradient(circle at calc(100% - 16px) 16px, rgba(217, 172, 182, 0.8) 0%, rgba(217, 172, 182, 0) 40%),
        radial-gradient(circle at 16px calc(100% - 16px), rgba(217, 172, 182, 0.8) 0%, rgba(217, 172, 182, 0) 40%),
        radial-gradient(circle at calc(100% - 16px) calc(100% - 16px), rgba(217, 172, 182, 0.8) 0%, rgba(217, 172, 182, 0) 40%);
      background-repeat: no-repeat;
    }
    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 40px;
    }
    .top-left {
      font-size: clamp(3rem, 4vw, 2.5rem);
      font-weight: 600;
      color: #d44f78;
      align-self: flex-start;
      margin-left: 50px;
      margin-top: 50px;
    }
    .bottom-center {
      font-size: clamp(5rem, 10vw, 3rem);
      font-weight: 700;
      color: #d44f78;
      text-align: center;
      position: fixed;
      left: 50.5%;
      bottom: 50px;
      transform: translateX(-50%);
      margin-bottom: 50px;
    }
    .bottom-right {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 600;
      color: #d44f78;
      align-self: flex-end;
      margin-right: 20px;
      margin-bottom: 35px;
    }
    .bouquet-area {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .bouquet-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }
    
    /* 信封整体定位 */
    .envelope-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 350px;
      height: 250px;
      pointer-events: none;
    }
    
    /* 信封翻开盖子 - 花朵后面，信封主体上面 */
    .envelope-flap {
      position: absolute;
      top: -150px;
      left: 0;
      width: 100%;
      height: 175px;
      background: linear-gradient(180deg, #f5e6c8 0%, #fdf6e3 100%);
      clip-path: polygon(0 100%, 50% 0, 100% 100%);
      border-radius: 0 0 10px 10px;
      z-index: 4.5;
    }
    
    /* 信封主体 - 最上层（矩形，遮住花杆）*/ 
    .envelope-body {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      height: 90%;
      background: linear-gradient(150deg, #fdf6e3 0%, #f5e6c8 100%);
      border-radius: 0 0 6px 6px;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.25),
        0 10px 25px rgba(0, 0, 0, 0.15);
      z-index: 9;
      
    }
    
   /*  信封开口V形 
    .envelope-opening {
      position: absolute;
      top: 100;
      left: 100;
      width: 100%;
      height: 100px;
      background: linear-gradient(-180deg, #f0e0c0 0%, #fdf6e3 100%);
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      z-index: 10;
    }*/

    
    
    /* 爱心封口贴 */
    .heart-sticker {
      position: absolute;
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      z-index: 10;
      filter: drop-shadow(0 4px 12px rgba(255, 107, 157, 0.5));
    }
    
    .heart-sticker svg {
      width: 100%;
      height: 100%;
      fill: #ff6b9d;
    }

    /* 花朵层 - 中间层 */
    .flowers-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 210px;
      height: 160px;
      z-index: 0;
    }

    .bouquet-flower {
      position: absolute;
      opacity: 0;
      animation: bloomUp 1s ease forwards;
      transform-origin: 50% 100%;
      z-index: 0;
    }
    
    @keyframes bloomUp {
      from { 
        opacity: 0; 
        transform: var(--base-transform) scale(0.3) translateY(50px); 
      }
      to { 
        opacity: 1; 
        transform: var(--base-transform) scale(var(--scale)) translateY(0); 
      }
    }
    
    .bouquet-flower svg {
      width: 100%;
      height: 100%;
    }
  
    
  </style>
</head>

    var flowersLayer = document.getElementById('flowersLayer');
    var allFlowers = [];
    
    // 收集所有花朵
    selectedFlowers.forEach(function(flowerId) {
      var svg = flowerSVGs[flowerId];
      if (!svg) return;
      var count = Math.floor(Math.random() * 2) + 1;
      for (var i = 0; i < count; i++) {
        allFlowers.push({svg: svg, flowerId: flowerId});
      }
    });

    function shuffle(array) {
      for (var i = array.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = array[i];
        array[i] = array[j];
        array[j] = temp;
      }
      return array;
    }

    // 避免相邻相同花朵
    function avoidAdjacentSame(flowers) {
      for (var i = 1; i < flowers.length; i++) {
        if (flowers[i].flowerId === flowers[i - 1].flowerId) {
          var swapIndex = -1;
          for (var j = i + 1; j < flowers.length; j++) {
            if (flowers[j].flowerId !== flowers[i - 1].flowerId) {
              swapIndex = j;
              break;
            }
          }
          if (swapIndex !== -1) {
            var temp = flowers[i];
            flowers[i] = flowers[swapIndex];
            flowers[swapIndex] = temp;
          }
        }
      }
      return flowers;
    }

    // 智能排列：先随机一朵，然后中间随机排列（避免相邻），最后再随机选一朵
    function smartArrange(flowers) {
      if (flowers.length <= 2) return flowers;
      
      // 分离不同种类的花
      var types = {};
      flowers.forEach(function(f) {
        if (!types[f.flowerId]) types[f.flowerId] = [];
        types[f.flowerId].push(f);
      });
      
      var typeKeys = Object.keys(types);
      var result = [];
      
      // 随机选第一朵
      var firstTypeIdx = Math.floor(Math.random() * typeKeys.length);
      var firstType = typeKeys[firstTypeIdx];
      var firstFlower = types[firstType].shift();
      result.push(firstFlower);
      
      // 如果该类型还有剩余，放回去
      if (types[firstType].length === 0) {
        delete types[firstType];
        typeKeys.splice(firstTypeIdx, 1);
      }
      
      // 收集剩余所有花
      var remaining = [];
      typeKeys.forEach(function(key) {
        remaining = remaining.concat(types[key]);
      });
      
      // 洗牌
      shuffle(remaining);
      
      // 避免相邻相同
      avoidAdjacentSame(remaining);
      
      // 如果剩余的第一朵和第一朵相同，尝试交换
      if (remaining.length > 0 && remaining[0].flowerId === firstFlower.flowerId) {
        for (var k = 1; k < remaining.length; k++) {
          if (remaining[k].flowerId !== firstFlower.flowerId) {
            var tmp = remaining[0];
            remaining[0] = remaining[k];
            remaining[k] = tmp;
            break;
          }
        }
      }
      
      // 中间部分
      result = result.concat(remaining);
      
      // 随机选最后一朵（确保不和倒数第二朵相同）
      var lastCandidates = [];
      flowers.forEach(function(f) {
        if (f.flowerId !== result[result.length - 1].flowerId) {
          lastCandidates.push(f);
        }
      });
      
      // 如果没有不同种类的，就从所有花里随机选一个（可能相同）
      if (lastCandidates.length === 0) {
        lastCandidates = flowers;
      }
      
      var lastFlower = lastCandidates[Math.floor(Math.random() * lastCandidates.length)];
      result.push(lastFlower);
      
      return result;
    }

    var arrangedFlowers = smartArrange(allFlowers);
    var totalFlowers = arrangedFlowers.length;
    
    arrangedFlowers.forEach(function(flower, index) {
      var div = document.createElement('div');
      div.className = 'bouquet-flower';
      div.innerHTML = flower.svg;
      
      // 花朵从信封顶部开口处向上冒出来，紧凑排列
      var rotate = (index - (totalFlowers - 1) / 2) * 10 + (Math.random() - 0.5) * 5;
      var scale = 1.1 + Math.random() * 0.6;
      
      // 紧凑排列，从信封顶部开口处开始
      var spreadX = (index - (totalFlowers - 1) / 2) * 14;
      
      // 花大一点：宽度70px
      div.style.width = '140px';
      div.style.height = 'auto';
      div.style.left = '50%';
      // 从信封顶部开口处开始（信封高度160，开口在顶部）
      div.style.bottom = '60%'; 
      div.style.marginLeft = spreadX + 'px';
      
      // 动画延迟 - 按顺序出现
      div.style.animationDelay = (index * 0.3) + 's';
      div.style.setProperty('--base-transform', 'translate(-50%, 0) rotate(' + rotate + 'deg)');
      div.style.setProperty('--scale', scale);
      
      flowersLayer.appendChild(div);
    });
  </script>
