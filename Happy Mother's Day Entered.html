  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      background: #ffe4e9;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }
    body {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #d44f78;
      padding: 20px 0;
    }
    .page-border {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .page-border::before,
    .page-border::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 42px;
    }
    .page-border::before {
      border: 1px solid #ff8fb3;
      box-shadow: 0 0 0 10px rgba(255, 182, 203, 0.22);
      background-image:
        radial-gradient(circle at 18px 18px, rgba(255, 179, 201, 0.85) 0%, rgba(255, 179, 201, 0) 42%),
        radial-gradient(circle at calc(100% - 18px) 18px, rgba(255, 179, 201, 0.85) 0%, rgba(255, 179, 201, 0) 42%),
        radial-gradient(circle at 18px calc(100% - 18px), rgba(255, 179, 201, 0.85) 0%, rgba(255, 179, 201, 0) 42%),
        radial-gradient(circle at calc(100% - 18px) calc(100% - 18px), rgba(255, 179, 201, 0.85) 0%, rgba(255, 179, 201, 0) 42%);
      background-repeat: no-repeat;
    }
    .page-border::after {
      inset: 18px;
      border: 1px solid #d9acb6;
      background-image:
        radial-gradient(circle at 16px 16px, rgba(217, 172, 182, 0.8) 0%, rgba(217, 172, 182, 0) 40%),
        radial-gradient(circle at calc(100% - 16px) 16px, rgba(217, 172, 182, 0.8) 0%, rgba(217, 172, 182, 0) 40%),
        radial-gradient(circle at 16px calc(100% - 16px), rgba(217, 172, 182, 0.8) 0%, rgba(217, 172, 182, 0) 40%),
        radial-gradient(circle at calc(100% - 16px) calc(100% - 16px), rgba(217, 172, 182, 0.8) 0%, rgba(217, 172, 182, 0) 40%);
      background-repeat: no-repeat;
    }
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 30px 60px;
      margin-bottom: 10px;
    }
    .top-btn {
      width: 10%;
      min-height: 3rem;
      background: #ffbdc9;
      border-radius: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
      border: none;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
    }
    .top-btn:hover,
    .top-btn:focus {
      transform: scale(1.03);
      background: #ff93b5;
      outline: none;
    }
    .flower-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      width: 90%;
      max-width: 600px;
      padding: 10px 16px;
      margin: 0 auto;
    }
    .flower-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 6px 2px;
    }
    .flower-svg {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1.35;
      max-width: 110px;
    }
    .checkbox-container {
      position: relative;
      width: 32px;
      height: 32px;
      cursor: pointer;
    }
    .checkbox {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }
    .checkmark {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.5);
      border: 2px solid rgba(180, 180, 180, 0.4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      pointer-events: none;
    }
    .checkmark::after {
      content: "";
      width: 16px;
      height: 12px;
      border: solid #ffffff;
      border-width: 0 0 3px 3px;
      transform: rotate(-45deg) scale(0);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-bottom: 2px;
    }
    .checkbox:checked + .checkmark {
      background: #4a90d9;
      border-color: #4a90d9;
      transform: scale(1.08);
      box-shadow: 0 3px 10px rgba(74, 144, 217, 0.35);
    }
    .checkbox:checked + .checkmark::after {
      transform: rotate(-45deg) scale(1);
    }
  </style>
</head>

  <script>
    function getUrlParam(name) {
      var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
      var r = window.location.search.substr(1).match(reg);
      if (r != null) return decodeURIComponent(r[2]); return null;
    }
    var userName = getUrlParam('name') || '';

    function goBouquet() {
      var checked = [];
      var checkboxes = document.querySelectorAll('.checkbox:checked');
      checkboxes.forEach(function(cb) {
        checked.push(cb.id);
      });
      if (checked.length === 0) {
        alert('请至少选择一朵花');
        return;
      }
      window.location.href = "Happy Mother's Day Bouquet.html?name=" + encodeURIComponent(userName) + "&flowers=" + encodeURIComponent(checked.join(','));
    }
  </script>
