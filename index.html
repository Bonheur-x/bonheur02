<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Mother's Day</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      position: relative;
      min-height: 100vh;
      background: #ffe4e9;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #d44f78;
      overflow: hidden;
      padding: 24px 0;
    }
    .page {
      width: min(96%, 520px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: calc(100vh - 48px);
      padding: 24px 18px;
    }
    .page-border {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .page-border::before,
    .page-border::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 42px;
    }
    .page-border::before {
      border: 1px solid #ff8fb3;
      box-shadow: 0 0 0 10px rgba(255, 182, 203, 0.22);
      background-image:
        radial-gradient(circle at 18px 18px, rgba(255, 179, 201, 0.85) 0%, rgba(255, 179, 201, 0) 42%),
        radial-gradient(circle at calc(100% - 18px) 18px, rgba(255, 179, 201, 0.85) 0%, rgba(255, 179, 201, 0) 42%),
        radial-gradient(circle at 18px calc(100% - 18px), rgba(255, 179, 201, 0.85) 0%, rgba(255, 179, 201, 0) 42%),
        radial-gradient(circle at calc(100% - 18px) calc(100% - 18px), rgba(255, 179, 201, 0.85) 0%, rgba(255, 179, 201, 0) 42%);
      background-repeat: no-repeat;
    }
    .page-border::after {
      inset: 18px;
      border: 1px solid #d9acb6;
      background-image:
        radial-gradient(circle at 16px 16px, rgba(217, 172, 182, 0.8) 0%, rgba(217, 172, 182, 0) 40%),
        radial-gradient(circle at calc(100% - 16px) 16px, rgba(217, 172, 182, 0.8) 0%, rgba(217, 172, 182, 0) 40%),
        radial-gradient(circle at 16px calc(100% - 16px), rgba(217, 172, 182, 0.8) 0%, rgba(217, 172, 182, 0) 40%),
        radial-gradient(circle at calc(100% - 16px) calc(100% - 16px), rgba(217, 172, 182, 0.8) 0%, rgba(217, 172, 182, 0) 40%);
      background-repeat: no-repeat;
    }
    .page,
    .hero,
    .controls {
      position: relative;
      z-index: 1;
    }
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 56vh;
    }
    .hero h1 {
      font-size: clamp(4.5rem, 8vw, 6rem);
      line-height: 2;
      text-align: center;
      letter-spacing: 0.05em;
      margin-bottom: 0.2rem;
      font-family: "Brush Script MT", "Lucida Handwriting", "Segoe Print", cursive;
      text-shadow: 3px 3px 9px rgba(128, 128, 128, 0.45);
    }
    .hero h1 span {
      display: block;
    }
    .hero h1 span.line2 {
      white-space: nowrap;
    }
    .hero .subtitle {
      font-size: clamp(1.1rem, 2vw, 1.6rem);
      color: #d2697a;
      margin-top: 0.3rem;
    }
    .controls {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      height: auto;
      gap: 22px;
      padding-bottom: 12px;
      margin-top: -1rem;
    }
    .input-card {
      background: #f2f2f2;
      border-radius: 24px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 6rem;
      width: 100%;
      position: relative;
      top: -0.25rem;
    }
    .input-card label {
      color: #666;
      font-size: 1rem;
    }
    .input-card input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 1rem;
      padding: 12px 14px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.08);
      color: #333;
    }
    .input-card input::placeholder {
      color: #aaa;
    }
    .btn-card {
      width: 50%;
      min-height: 6rem;
      align-self: center;
      background: #ffbdc9;
      border-radius: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
      border: none;
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: 700;
      transform-origin: center;
      position: relative;
      top: 0.25rem;
    }
    .btn-card:hover,
    .btn-card:focus {
      transform: scale(1.03);
      background: #ff93b5;
      color: #ffffff;
      outline: none;
    }

    /* ========== 手机端适配 ========== */
    @media (max-width: 768px) {
      body {
        padding: 16px 0;
      }
      .page {
        width: 92%;
        max-width: 420px;
        min-height: calc(100vh - 32px);
        padding: 20px 14px;
      }
      .page-border::before,
      .page-border::after {
        inset: 8px;
        border-radius: 32px;
      }
      .page-border::after {
        inset: 14px;
      }
      .hero {
        height: auto;
        flex: 1;
        padding: 20px 0;
      }
      .hero h1 {
        font-size: 2.8rem;
        line-height: 1.3;
        letter-spacing: 0.02em;
        margin-bottom: 0.5rem;
        text-shadow: 2px 2px 6px rgba(128, 128, 128, 0.35);
      }
      .hero h1 span.line2 {
        font-size: 2.2rem;
      }
      .controls {
        gap: 16px;
        padding-bottom: 8px;
        margin-top: 0;
      }
      .input-card {
        padding: 14px 16px;
        gap: 8px;
        min-height: auto;
        top: 0;
      }
      .input-card label {
        font-size: 0.9rem;
      }
      .input-card input {
        padding: 10px 12px;
        border-radius: 14px;
      }
      .btn-card {
        width: 60%;
        max-width: 200px;
        min-height: 3.2rem;
        border-radius: 24px;
        font-size: 1.1rem;
        top: 0;
      }
      .btn-card:active {
        transform: scale(0.97);
        background: #ff93b5;
      }
    }

    /* 小屏幕手机 */
    @media (max-width: 380px) {
      .hero h1 {
        font-size: 2.4rem;
      }
      .hero h1 span.line2 {
        font-size: 1.9rem;
      }
      .page {
        width: 94%;
        padding: 16px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="page-border"></div>
  <div class="page">
    <section class="hero">
      <h1>
        <span>Happy</span>
        <span class="line2">Mother's Day</span>
      </h1>
    </section>
    <section class="controls">
      <div class="input-card">
        <label for="name">请输入您的名字：</label>
        <input id="name" type="text" placeholder=" " />
      </div>
      <button class="btn-card" type="button" onclick="enter()">进入</button>
    </section>
  </div>
  <script>
    function enter() {
      var name = document.getElementById('name').value.trim();
      if (!name) {
        alert('请输入您的名字');
        return;
      }
      window.location.href = "Happy Mother's Day Entered.html?name=" + encodeURIComponent(name);
    }
    document.getElementById('name').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') enter();
    });
  </script>
</body>
</html>
